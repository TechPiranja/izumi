name: Deploy to itch.io

# Every push to main exports the web version and uploads it to itch.io.
# Needs these settings in the GitHub repository (Settings > Secrets and variables > Actions):
#   secret   BUTLER_API_KEY  an API key from https://itch.io/user/settings/api-keys
#   variable ITCH_USER       your itch.io user name
#   variable ITCH_GAME       the project name in the itch.io URL, e.g. izumi
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4

      # GitHub runs the steps with another home folder than the image, so the templates are moved over.
      # The folder name is read from the image (not from $GODOT_VERSION, which is empty in this step).
      - name: Set up export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          for dir in /root/.local/share/godot/export_templates/*; do
            name=$(basename "$dir")
            mv -v "$dir" ~/.local/share/godot/export_templates/"${name%.stable}.stable"
          done
          ls ~/.local/share/godot/export_templates/
          godot --version

      # The imported resources (.godot/) are not in git, so they are created first.
      - name: Import resources
        run: godot --headless --import || true

      # itch.io starts the file called index.html.
      - name: Export web version
        run: |
          mkdir -v -p build/web
          godot --headless --verbose --export-release "Web" build/web/index.html

      - name: Upload to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_USER: ${{ vars.ITCH_USER }}
          ITCH_GAME: ${{ vars.ITCH_GAME }}
        shell: bash
        run: |
          # Say clearly which setting is missing (secrets and variables are per repository).
          missing=0
          for name in BUTLER_API_KEY ITCH_USER ITCH_GAME; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty. Add it under Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1

          if ! command -v butler > /dev/null; then
            curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
            unzip -o butler.zip -d butler-bin
            chmod +x butler-bin/butler
            export PATH="$PWD/butler-bin:$PATH"
          fi
          butler version
          ls -la build/web
          butler push build/web "$ITCH_USER/$ITCH_GAME:html5"
